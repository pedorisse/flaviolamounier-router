<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flávio Lamounier</title>

    <meta
      name="description"
      content="Página institucional de Flávio Lamounier."
    />

    <meta
      name="robots"
      content="noindex, nofollow, noarchive"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #071b16;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(520px, 100%);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(32px, 7vw, 54px);
        font-weight: 400;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.65);
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Flávio Lamounier</h1>
      <p>Infraestrutura hídrica · Saneamento · Soluções técnicas</p>
    </main>
  </body>
</html>
